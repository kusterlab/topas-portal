# Default values for topas-portal.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

backend:
  image:
    repository: gitlab.lrz.de:5005/proteomics/topas/topas-portal/backend
    pullPolicy: IfNotPresent
    tag: ""

  service:
    type: NodePort
    port: 3832
    nodePort: 30832

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext: {}

  resources: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

frontend:
  image:
    repository: gitlab.lrz.de:5005/proteomics/topas/topas-portal/frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: NodePort
    port: 3834
    nodePort: 30834

  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}

  securityContext: {}

  resources: {}

  livenessProbe:
    httpGet:
      path: /
      port: http
  readinessProbe:
    httpGet:
      path: /
      port: http

  volumes: []
  volumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
