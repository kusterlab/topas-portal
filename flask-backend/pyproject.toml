[tool.poetry]
name = "mtb_portal_flask"
version = "0.1.0"
description = ""
authors = ["Matthew The <matthew.the@tum.de>"]
license = "Apache Licence, version 2.0"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.9,<3.11"
pandas = "^1.4.2"
Flask = "^2.1.2"
Flask-Cors = "^3.0.10"
openpyxl = "^3.0.9"
scipy = "^1.8.0"
ppca = "^0.0.4"
umap-learn = "^0.5.3"
plotly = "^5.6.0"
statsmodels = "^0.14.0"
peewee = "^3.17.0"
phate = "^1.0.11"
Flask-Caching = "^2.1.0"
scikit-learn = "^1.4.0"
psite-annotation = "^0.5.0"
psycopg2-binary = { version = "^2.9", optional = true }
flask-compress = "^1.15"
requests = "^2.32.3"
pyarrow = "^19.0.1"
flask-jwt-extended = "^4.7.1"
xlsxwriter = "^3.2.9"
seaborn = "^0.13.2"
pymongo = "^4.15.5"
pydantic = "^2.12.5"
numpy = "1.26.4"
python-dotenv = "^1.2.1"
python-pptx = "^1.0.2"

[tool.poetry.extras]
